# German host. Mini app and API for servys.
# Does not change tg.trainys.ru, tg.productys.ru, ports 8090 and 8091.
# Install the port 80 server first, issue the certificate with
# certbot certonly --webroot, then install the 443 server.
# Do not run certbot --nginx: it can rewrite the other sites.
server {
    listen 80;
    listen [::]:80;
    server_name servys.productys.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/servys-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name servys.productys.ru;
    ssl_certificate /etc/letsencrypt/live/servys.productys.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servys.productys.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location / {
        root /var/lib/servys/public;
        try_files $uri $uri/ /index.html;
    }
}
