# Основная модель проекта — qwen3.5:9b (ADR-005). Лимит 13 ГБ — запас под неё на машине с настоящей RAM.
# Хост 5.252.225.191 имеет 1,9 ГиБ RAM и файл подкачки 13 ГиБ. Этот compose целиком там не поднимать: на хосте уже шлюз Telegram.
services:
  ollama:
    image: ollama/ollama:latest
    mem_limit: 13g
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30s"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  searxng:
    image: searxng/searxng:latest
    ports:
      - "18081:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:18081/

volumes:
  ollama:
